name: Auditoría normativa

on:
  schedule:
    # Lunes 13:00 UTC = 09:00 Chile (UTC-4)
    - cron: '0 13 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24: el package-lock.json se genera con npm 11 (local); npm 10
      # (Node 20) lo rechaza con EUSAGE "Missing esbuild from lock file".
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (incluye ratchet de trazabilidad y consistencia RF)
        run: npx vitest run

      - name: Auditoría de cruce LOSCAT × LOFC × LOSCAA
        run: |
          echo "## 📋 Auditoría de cruce normativo" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/auditar-cruce-normativo.mjs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build de verificación
        run: npx vite build
